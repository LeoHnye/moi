    <header class="site-header">
        <a class="brand" href="index.html">

            <button class="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false">

        <main class="contact-main">
            <section class="contact-message">
                <p class="eyebrow">CONTACT</p>
                <h1>Une idée à tester ?<br><em>Écrivons-la.</em></h1>
                <p>Projet collaboratif, opportunité, initiative jeunesse : je suis ouvert aux échanges.</p>
                </section><section class="contact-form-wrap">
                    <form id="form-contact"><label for="nom">Votre nom</label>

                        <label for="email">Votre email</label>
                        <input id="email" name="email" type="email" placeholder="vous@exemple.com" required>
                        <label for="message">Votre message</label>
                        <textarea id="message" name="message" placeholder="Parlez-moi de votre idée…" required></textarea>

                    </form>
                </section>
